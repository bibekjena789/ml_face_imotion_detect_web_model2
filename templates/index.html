<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Emotion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="panel">
    <div id="top-emotion">No face</div>
    <div id="scores"></div>
  </div>

  <div id="start-screen">
    <h1>Live Emotion</h1>
    <p>Turn on your camera to see your facial emotion live.</p>
    <button id="start-btn">Start camera</button>
    <p id="error"></p>
  </div>

  <script>const CLASSES = {{ classes|tojson }};</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
